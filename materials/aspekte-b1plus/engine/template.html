<!doctype html>
<html lang="de" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="gsap.min.js"></script>
<style>
  @font-face { font-family: "Inter Display"; font-weight: 500; src: local("Inter Display Medium"), local("InterDisplay-Medium"); }
  @font-face { font-family: "Inter Display"; font-weight: 600; src: local("Inter Display SemiBold"), local("InterDisplay-SemiBold"); }
  @font-face { font-family: "Inter Display"; font-weight: 700; src: local("Inter Display Bold"), local("InterDisplay-Bold"); }
  @font-face { font-family: "Inter Display"; font-weight: 800; src: local("Inter Display ExtraBold"), local("InterDisplay-ExtraBold"); }
  @font-face { font-family: "Inter Display"; font-weight: 900; src: local("Inter Display Black"), local("InterDisplay-Black"); }
  @font-face { font-family: "Noto Color Emoji"; src: local("Noto Color Emoji"), local("NotoColorEmoji"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #FFF7EC; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #FFF7EC; font-family: "Inter Display", Inter, sans-serif; color: #1F2A44; }
  .layer { position: absolute; inset: 0; }
  .blob { position: absolute; border-radius: 50%; filter: blur(2px); }
  .em { font-family: "Noto Color Emoji"; }
  b { color: var(--c); font-weight: 900; }
  s { color: #868E96; text-decoration-color: #E03131; text-decoration-thickness: 6px; }
  i { font-style: normal; font-weight: 600; color: #7A8296; }
  .nom { color: #1C7ED6; font-weight: 900; } .akk { color: #E8590C; font-weight: 900; } .dat { color: #0CA678; font-weight: 900; }
  #chip { position: absolute; top: 110px; left: 60px; padding: 14px 28px; border-radius: 40px; background: #fff; font: 700 34px "Inter Display"; box-shadow: 0 6px 18px rgba(31,42,68,.08); }
  #steps { position: absolute; top: 122px; right: 60px; display: flex; gap: 14px; }
  .dot { width: 26px; height: 26px; border-radius: 50%; background: #E9DFD0; }
  .scene { position: absolute; inset: 0; padding: 250px 60px 0; opacity: 0; }
  .btitle { text-align: center; font: 900 96px/1.05 "Inter Display"; letter-spacing: -0.02em; margin-bottom: 20px; }
  .btitle b { color: #E8590C; }
  .rhead { display: flex; align-items: center; gap: 26px; }
  .rnum { width: 120px; height: 120px; border-radius: 50%; background: var(--c); color: #fff; text-align: center; font: 900 78px/120px Inter; flex: none; }
  .rlab { font: 900 64px/1.1 "Inter Display"; }
  .badge { display: inline-block; margin-top: 26px; padding: 12px 34px; border-radius: 28px; background: var(--soft); color: var(--c); border: 5px solid var(--c); font: 900 64px "Inter Display"; opacity: 0; }
  .rows { margin-top: 40px; }
  .row { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; padding: 30px 34px; border-radius: 34px; background: #fff;
    box-shadow: 0 14px 34px rgba(31,42,68,.1); border-left: 14px solid var(--c); opacity: 0; font: 800 52px/1.2 "Inter Display"; }
  .row .em { font-size: 64px; flex: none; }
  .row.pair .l { font-weight: 700; color: #5C667D; }
  .row.pair .arr { color: #ADB5BD; font-weight: 700; }
  .row.pair .r { margin-left: auto; white-space: nowrap; font-size: 60px; font-weight: 900; opacity: 0; }
  .row.formula { justify-content: center; text-align: center; background: var(--soft); border: 5px dashed var(--c); font-size: 58px; font-weight: 900; }
  .row.small { font-size: 46px; }
  .notes { display: flex; flex-wrap: wrap; gap: 18px; }
  .note { padding: 20px 34px; border-radius: 30px; background: var(--soft); color: var(--c); font: 800 48px/1.2 "Inter Display"; opacity: 0; }
  .qhead { text-align: center; font: 800 52px "Inter Display"; margin-bottom: 30px; }
  .qhead span { display: inline-block; margin-right: 10px; padding: 8px 26px; border-radius: 24px; background: #E8590C; color: #fff; font-weight: 900; }
  .qrow { margin-bottom: 22px; padding: 26px 32px; border-radius: 34px; background: #fff; border: 5px solid #fff; box-shadow: 0 12px 30px rgba(31,42,68,.1); opacity: 0; }
  .qq { display: flex; align-items: center; gap: 18px; font: 800 48px/1.2 "Inter Display"; }
  .qn { width: 62px; height: 62px; border-radius: 50%; background: #1F2A44; color: #fff; text-align: center; font: 900 38px/62px Inter; flex: none; }
  .qq .em { font-size: 56px; flex: none; }
  .qa { position: relative; min-height: 80px; margin-top: 12px; padding-left: 80px; }
  .qm { position: absolute; left: 80px; top: 0; width: 80px; height: 80px; border-radius: 24px; background: #F1F3F5; color: #ADB5BD; text-align: center; font: 900 58px/80px Inter; }
  .qans { display: block; font: 900 52px/1.25 "Inter Display"; color: #1F2A44; opacity: 0; }
  .qans b { color: #2F9E44; }
  .timer { position: absolute; top: 1610px; left: 130px; width: 200px; height: 200px; opacity: 0; }
  .timer svg { width: 200px; height: 200px; }
  .trk { fill: #fff; stroke: #E9DFD0; stroke-width: 16; }
  .rng { fill: none; stroke: #E8590C; stroke-width: 16; stroke-linecap: round; stroke-dasharray: 540.4; transform: rotate(-90deg); transform-origin: 100px 100px; }
  .tnum span { position: absolute; inset: 0; text-align: center; font: 900 100px/200px Inter; opacity: 0; }
  .pause { position: absolute; top: 1655px; left: 380px; padding: 24px 36px; border-radius: 34px; background: #1F2A44; color: #fff; font: 800 52px "Inter Display"; opacity: 0; }
  .many .qhead { margin-bottom: 20px; }
  .many .qrow { margin-bottom: 16px; padding: 18px 28px; }
  .many .qq { font-size: 44px; } .many .qq .em { font-size: 50px; } .many .qn { width: 56px; height: 56px; font-size: 34px; line-height: 56px; }
  .many .qa { min-height: 66px; margin-top: 8px; } .many .qm { width: 66px; height: 66px; font-size: 48px; line-height: 66px; }
  .many .qans { font-size: 46px; }
  .row.qa { flex-wrap: wrap; row-gap: 8px; } .row.qa .l { flex: 1 1 0; min-width: 0; } .row.qa .arr { display: none; }
  .row.qa .r { margin-left: 84px; width: 100%; white-space: normal; font-size: 52px; }
  .row.qa:not(:has(.em)) .r { margin-left: 0; }
  .tbl { margin-top: 10px; }
  .trow { display: grid; grid-template-columns: 96px repeat(4, 1fr); gap: 12px; margin-bottom: 16px; opacity: 0; }
  .trow > div { background: #fff; border-radius: 24px; padding: 24px 6px; text-align: center; font: 800 46px/1.2 "Inter Display"; box-shadow: 0 8px 20px rgba(31,42,68,.08); }
  .trow > div:first-child { background: var(--c); color: #fff; font: 900 54px/1.2 Inter; display: flex; align-items: center; justify-content: center; }
  .trow.th > div { background: var(--soft); color: var(--c); font-weight: 900; box-shadow: none; padding: 10px 6px; }
  .trow.th > div:first-child { background: transparent; }
  #cta { position: absolute; left: 70px; right: 70px; top: 1120px; padding: 44px 50px; border-radius: 44px; background: #1F2A44; color: #fff; text-align: center; opacity: 0; }
  #cta .t1 { font: 900 62px/1.15 "Inter Display"; } #cta .t1 b { color: #FFA94D; }
  #cta .t2 { margin-top: 18px; font: 600 44px Inter; color: #C9D1E6; }
  #cta .pts { display: flex; justify-content: center; gap: 22px; margin-top: 26px; }
  #cta .pts span { padding: 12px 26px; border-radius: 24px; background: #2C3A5C; font: 800 44px Inter; opacity: 0; }
  #cta .pts:empty { display: none; }
  #arrow { position: absolute; left: 485px; top: 1600px; font: 110px "Noto Color Emoji"; opacity: 0; }
  #caps { position: absolute; left: 50px; right: 50px; top: 1600px; height: 180px; }
  .cue { position: absolute; left: 0; right: 0; top: 0; text-align: center; opacity: 0; font: 800 60px/1.2 "Inter Display"; }
  .cue .w { display: inline-block; margin: 0 .13em; color: #1F2A44; transform-origin: 50% 70%; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{D}}" data-width="1080" data-height="1920">
  <div id="bg" class="layer clip" data-start="0" data-duration="{{D}}" data-track-index="0">
    <div id="b1" class="blob" style="left:-160px;top:180px;width:620px;height:620px;background:#FFE3C2"></div>
    <div id="b2" class="blob" style="left:640px;top:820px;width:560px;height:560px;background:#DBE4FF"></div>
    <div id="b3" class="blob" style="left:-120px;top:1380px;width:520px;height:520px;background:#D3F9D8"></div>
  </div>
  <div id="ui" class="layer clip" data-start="0" data-duration="{{D}}" data-track-index="1">
    <div id="chip">{{CHIP}}</div>
    <div id="steps">{{DOTS}}</div>
{{SCENES}}
  </div>
  <div id="caps" class="clip" data-start="0" data-duration="{{D}}" data-track-index="2">
{{CAPS}}
  </div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  const D = {{D}};
  tl.to("#b1", { x: 120, y: 80, duration: D, ease: "sine.inOut" }, 0);
  tl.to("#b2", { x: -140, y: -60, duration: D, ease: "sine.inOut" }, 0);
  tl.to("#b3", { x: 160, y: -90, duration: D, ease: "sine.inOut" }, 0);
{{JS}}
  tl.set({}, {}, D);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
