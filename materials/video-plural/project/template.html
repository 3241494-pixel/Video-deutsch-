<!doctype html>
<html lang="de" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="gsap.min.js"></script>
<style>
  @font-face { font-family: "Inter Display"; font-weight: 500; src: local("Inter Display Medium"), local("InterDisplay-Medium"); }
  @font-face { font-family: "Inter Display"; font-weight: 600; src: local("Inter Display SemiBold"), local("InterDisplay-SemiBold"); }
  @font-face { font-family: "Inter Display"; font-weight: 700; src: local("Inter Display Bold"), local("InterDisplay-Bold"); }
  @font-face { font-family: "Inter Display"; font-weight: 800; src: local("Inter Display ExtraBold"), local("InterDisplay-ExtraBold"); }
  @font-face { font-family: "Inter Display"; font-weight: 900; src: local("Inter Display Black"), local("InterDisplay-Black"); }
  @font-face { font-family: "Noto Color Emoji"; src: local("Noto Color Emoji"), local("NotoColorEmoji"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #FFF7EC; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #FFF7EC;
    font-family: "Inter Display", Inter, sans-serif; color: #1F2A44; }
  .layer { position: absolute; inset: 0; }
  .blob { position: absolute; border-radius: 50%; filter: blur(2px); }
  i { font-style: normal; font-weight: 600; color: #7A8296; font-size: .72em; }
  .em { font-family: "Noto Color Emoji"; }
  /* верхняя плашка и прогресс по правилам */
  #chip { position: absolute; top: 110px; left: 60px; padding: 14px 28px; border-radius: 40px; background: #fff;
    font: 700 34px "Inter Display"; box-shadow: 0 6px 18px rgba(31,42,68,.08); }
  #steps { position: absolute; top: 122px; right: 60px; display: flex; gap: 14px; }
  .dot { width: 26px; height: 26px; border-radius: 50%; background: #E9DFD0; }
  .scene { position: absolute; inset: 0; opacity: 0; }
  /* хук */
  #hTitle { position: absolute; top: 290px; left: 0; right: 0; text-align: center; font: 900 120px "Inter Display"; letter-spacing: -0.03em; opacity: 0; }
  #hTitle span { color: #E8590C; }
  #hRows { position: absolute; top: 500px; left: 90px; right: 90px; }
  .hrow { display: flex; align-items: center; gap: 22px; margin-bottom: 30px; padding: 30px 40px; border-radius: 36px; background: #fff;
    font: 800 68px "Inter Display"; box-shadow: 0 14px 34px rgba(31,42,68,.1); opacity: 0; }
  .hrow .em { font-size: 70px; }
  .n { display: inline-block; width: 70px; height: 70px; margin-right: 14px; border-radius: 50%; background: #FFE3C2; color: #E8590C;
    font: 900 46px/70px Inter; text-align: center; vertical-align: 8px; }
  .hrow .arr, .ex .arr { color: #ADB5BD; font-weight: 700; }
  .hrow .pl { opacity: 0; } .hrow .pl b, .ex .pl b, .q .qa b { color: #E8590C; }
  #hChaos { position: absolute; top: 1060px; left: 0; right: 0; text-align: center; font: 900 96px "Inter Display"; color: #E03131; opacity: 0; }
  #hSix { position: absolute; top: 1270px; left: 0; right: 0; text-align: center; font: 900 90px "Inter Display"; opacity: 0; }
  #hSix span { display: inline-block; width: 190px; height: 190px; margin-right: 20px; border-radius: 50%; background: #E8590C; color: #fff;
    font: 900 140px/190px Inter; vertical-align: middle; }
  /* правило */
  .rule { padding: 270px 60px 0; }
  .rhead { display: flex; align-items: center; gap: 28px; }
  .rnum { width: 130px; height: 130px; border-radius: 50%; background: var(--c); color: #fff; text-align: center; font: 900 84px/130px Inter; }
  .rlab { font: 900 66px "Inter Display"; }
  .rend { margin-left: auto; padding: 14px 34px; border-radius: 30px; background: var(--soft); color: var(--c); font: 900 84px "Inter Display";
    border: 5px solid var(--c); opacity: 0; }
  .exs { margin-top: 70px; }
  .ex { display: flex; align-items: center; gap: 20px; margin-bottom: 38px; padding: 46px 34px; border-radius: 36px; background: #fff;
    box-shadow: 0 14px 34px rgba(31,42,68,.1); border-left: 14px solid var(--c); opacity: 0; }
  .ex .em { font-size: 72px; width: 90px; text-align: center; }
  .ex .sg { font: 700 50px "Inter Display"; color: #5C667D; }
  .ex .arr { font-size: 50px; }
  .ex .pl { margin-left: auto; font: 900 64px "Inter Display"; opacity: 0; }
  .rnote { display: inline-block; margin-top: 26px; padding: 20px 34px; border-radius: 30px; background: var(--soft); color: var(--c);
    font: 800 50px "Inter Display"; opacity: 0; }
  /* совет */
  #tipHead { position: absolute; top: 300px; left: 0; right: 0; text-align: center; font: 900 90px "Inter Display"; opacity: 0; }
  #tipTxt { position: absolute; top: 450px; left: 90px; right: 90px; text-align: center; font: 700 60px/1.25 "Inter Display"; color: #5C667D; opacity: 0; }
  #tipTxt b { color: #E8590C; }
  #card { position: absolute; top: 720px; left: 170px; width: 740px; height: 500px; perspective: 1400px; opacity: 0; }
  #card .cf, #card .cb { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 48px; background: #fff; box-shadow: 0 24px 60px rgba(31,42,68,.16); backface-visibility: hidden; text-align: center; }
  #card .cf { font: 900 140px "Inter Display"; border: 6px dashed #E9DFD0; }
  #card .cb { font: 900 96px/1.3 "Inter Display"; border: 6px solid #2F9E44; }
  #card .cb span { font-size: 104px; } #card .cb b { color: #E8590C; }
  /* тест */
  #qHead { position: absolute; top: 260px; left: 0; right: 0; text-align: center; font: 800 54px "Inter Display"; opacity: 0; }
  #qHead span { display: inline-block; margin-right: 10px; padding: 8px 26px; border-radius: 24px; background: #E8590C; color: #fff; font-weight: 900; }
  #qList { position: absolute; top: 380px; left: 70px; right: 70px; }
  .q { position: relative; display: flex; align-items: center; gap: 20px; height: 150px; margin-bottom: 22px; padding: 0 34px; border-radius: 36px;
    background: #fff; border: 5px solid #fff; box-shadow: 0 12px 30px rgba(31,42,68,.1); opacity: 0; }
  .qn { width: 66px; height: 66px; border-radius: 50%; background: #1F2A44; color: #fff; text-align: center; font: 900 40px/66px Inter; }
  .q .em { font-size: 64px; }
  .q .sg { font: 800 56px "Inter Display"; }
  .ans { position: relative; margin-left: auto; min-width: 330px; height: 100px; text-align: right; }
  .qm { position: absolute; right: 0; top: 0; width: 100px; height: 100px; border-radius: 28px; background: #F1F3F5; color: #ADB5BD;
    text-align: center; font: 900 72px/100px Inter; }
  .qa { position: absolute; right: 0; top: 0; white-space: nowrap; font: 900 60px/100px "Inter Display"; opacity: 0; }
  #timer { position: absolute; top: 1290px; left: 130px; width: 220px; height: 220px; opacity: 0; }
  #timer svg { width: 220px; height: 220px; }
  .trk { fill: #fff; stroke: #E9DFD0; stroke-width: 16; }
  .rng { fill: none; stroke: #E8590C; stroke-width: 16; stroke-linecap: round; stroke-dasharray: 540.4; transform: rotate(-90deg); transform-origin: 100px 100px; }
  #tnum span { position: absolute; inset: 0; text-align: center; font: 900 110px/220px Inter; opacity: 0; }
  #pause { position: absolute; top: 1345px; left: 390px; padding: 26px 38px; border-radius: 34px; background: #1F2A44; color: #fff;
    font: 800 54px "Inter Display"; opacity: 0; }
  /* финал */
  #cta { position: absolute; left: 70px; right: 70px; top: 1080px; padding: 44px 50px; border-radius: 44px; background: #1F2A44; color: #fff;
    text-align: center; opacity: 0; }
  #cta .t1 { font: 900 64px/1.15 "Inter Display"; } #cta .t1 b { color: #FFA94D; }
  #cta .t2 { margin-top: 18px; font: 600 44px Inter; color: #C9D1E6; }
  #cta .pts { display: flex; justify-content: center; gap: 22px; margin-top: 30px; }
  #cta .pts span { padding: 12px 26px; border-radius: 24px; background: #2C3A5C; font: 800 44px Inter; opacity: 0; }
  #arrow { position: absolute; left: 485px; top: 1560px; font: 110px "Noto Color Emoji"; opacity: 0; }
  /* субтитры */
  #caps { position: absolute; left: 50px; right: 50px; top: 1600px; height: 180px; }
  .cue { position: absolute; left: 0; right: 0; top: 0; text-align: center; opacity: 0; font: 800 62px/1.2 "Inter Display"; }
  .cue .w { display: inline-block; margin: 0 .13em; color: #1F2A44; transform-origin: 50% 70%; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{D}}" data-width="1080" data-height="1920">

  <div id="bg" class="layer clip" data-start="0" data-duration="{{D}}" data-track-index="0">
    <div id="b1" class="blob" style="left:-160px;top:180px;width:620px;height:620px;background:#FFE3C2"></div>
    <div id="b2" class="blob" style="left:640px;top:820px;width:560px;height:560px;background:#DBE4FF"></div>
    <div id="b3" class="blob" style="left:-120px;top:1380px;width:520px;height:520px;background:#D3F9D8"></div>
  </div>

  <div id="ui" class="layer clip" data-start="0" data-duration="{{D}}" data-track-index="1">
    <div id="chip">🇩🇪 Plural · A2–B1</div>
    <div id="steps"><div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div><div class="dot" id="d4"></div><div class="dot" id="d5"></div><div class="dot" id="d6"></div></div>
{{SCENES}}
  </div>

  <div id="caps" class="clip" data-start="0" data-duration="{{D}}" data-track-index="2">
{{CAPS}}
  </div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  const D = {{D}};
  // фон: медленный дрейф пятен
  tl.to("#b1", { x: 120, y: 80, duration: D, ease: "sine.inOut" }, 0);
  tl.to("#b2", { x: -140, y: -60, duration: D, ease: "sine.inOut" }, 0);
  tl.to("#b3", { x: 160, y: -90, duration: D, ease: "sine.inOut" }, 0);
{{JS}}
  tl.set({}, {}, D);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
